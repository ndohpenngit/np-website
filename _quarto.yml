project:
  type: website
  output-dir: docs

website:
  title: "Ndoh Penn"
  description: "Biostatistician | Clinical Development | R & SAS"
  favicon: assets/favicon.ico
  site-url: https://ndohpenngit.github.io/np-website
  image: assets/og-image.png
  404: 404.qmd

  navbar:
    background: "#1a3a5c"
    foreground: light
    title: "Ndoh Penn"
    left:
      - text: "About"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/ndohpenn
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/ndohpenngit
        aria-label: GitHub

  page-footer:
    background: "#1a3a5c"
    foreground: light
    center: "© 2026 Ndoh Penn · Built with [Quarto](https://quarto.org)"

  open-graph:
    title: "Ndoh Penn – Biostatistician"
    description: "Biostatistician with 5+ years in pharmaceutical drug development — from preclinical research to clinical assay statistics at GSK."
    image: assets/og-image.png
    locale: en_GB

  twitter-card:
    title: "Ndoh Penn – Biostatistician"
    description: "Biostatistician with 5+ years in pharmaceutical drug development."
    image: assets/og-image.png
    card-style: summary_large_image

  google-analytics: ""

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    page-layout: full
    include-in-header:
      - text: |
          <script src="theme-toggle.js"></script>
