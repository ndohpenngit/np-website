<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #1a3a5c;
    font-family: Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 100%; height: 100%;
    padding: 70px 90px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .accent {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 8px;
    background: #2e7d60;
  }
  .top { display: flex; flex-direction: column; gap: 18px; }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2e7d60;
  }
  .name {
    font-size: 88px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .tagline {
    font-size: 28px;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    max-width: 700px;
    font-style: italic;
  }
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .tags {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .tag {
    background: rgba(46,125,96,0.25);
    border: 1px solid rgba(46,125,96,0.5);
    color: #5aad8a;
    padding: 8px 20px;
    border-radius: 100px;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 0.06em;
  }
  .url {
    font-family: 'Courier New', monospace;
    font-size: 18px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>
  <div class="top">
    <div class="eyebrow">Biostatistician</div>
    <div class="name">Ndoh Penn</div>
    <div class="tagline">Rigorous, reproducible, audit-ready statistical analysis<br>for pharmaceutical drug development.</div>
  </div>
  <div class="bottom">
    <div class="tags">
      <span class="tag">R & SAS</span>
      <span class="tag">Bayesian Methods</span>
      <span class="tag">Clinical Trials</span>
    </div>
    <div class="url">ndohpenngit.github.io/np-website</div>
  </div>
</div>
</body>
</html>
